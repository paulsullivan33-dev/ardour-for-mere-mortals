site_name: Ardour for Mere Mortals
site_description: A digital audio workstation you can inspect down to its session files. Recording multitrack audio and MIDI, editing regions on a timeline, mixing with plugins, scripting the whole program in Lua, and exporting a finished file whose contents this guide measures rather than assumes, with the limits stated plainly.
